<!--
  BBSW Sponsors — Squarespace Code Block (v1)
  Source: bbsw-website/sponsors/squarespace-code-block.html — paste this whole file into the Sponsor page's Code Block.

  Data and logos come from bbsw-app (production only):
    sponsors.json  https://raw.githubusercontent.com/YannanTang/bbsw-app/main/src/data/sponsors.json
    logos          https://app.bbsw.org/sponsors/<id>.png
  Adding or editing sponsors happens in bbsw-app and never requires re-pasting this block.
  Do not put test URLs in this file; see README.md for how to preview against test data.
-->
<style>
  #bbsw-sponsors {
    --bbsw-sp-red: #c0392b;
    --bbsw-sp-red-dark: #a93226;
    --bbsw-sp-border: #e3e3e3;
    --bbsw-sp-gap: 16px;
    font-family: inherit;
    max-width: 960px;
    margin: 0 auto;
    padding: 0 16px;
    color: #222;
  }

  #bbsw-sponsors *,
  #bbsw-sponsors *::before,
  #bbsw-sponsors *::after { box-sizing: border-box; }

  #bbsw-sponsors .bbsw-sp-heading {
    font-family: inherit;
    font-size: 1.1em;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    line-height: 1.3;
    color: var(--bbsw-sp-red);
    border-bottom: 2px solid var(--bbsw-sp-red);
    text-align: center;
    padding: 0 0 6px 0.08em; /* left padding offsets the trailing letter-spacing so the text is truly centered */
    margin: 0 0 24px;
  }

  #bbsw-sponsors .bbsw-sp-tier { margin-top: 40px; }
  #bbsw-sponsors .bbsw-sp-tier + .bbsw-sp-tier { margin-top: 64px; }

  /* Tier prominence: tiles per row at full width, minimum tile width, and logo height.
     At the 960px max width this gives 3 / 4 / 5 / 6 tiles per row; narrower containers fit fewer
     (never below 2 per row), and every row, including a partial last row, is centered. */
  #bbsw-sponsors .bbsw-sp-tier-diamond  { --bbsw-sp-cols: 3; --bbsw-sp-min: 260px; --bbsw-sp-logo-h: 110px; }
  #bbsw-sponsors .bbsw-sp-tier-platinum { --bbsw-sp-cols: 4; --bbsw-sp-min: 200px; --bbsw-sp-logo-h: 88px; }
  #bbsw-sponsors .bbsw-sp-tier-gold     { --bbsw-sp-cols: 5; --bbsw-sp-min: 160px; --bbsw-sp-logo-h: 70px; }
  #bbsw-sponsors .bbsw-sp-tier-silver   { --bbsw-sp-cols: 6; --bbsw-sp-min: 130px; --bbsw-sp-logo-h: 56px; }

  #bbsw-sponsors .bbsw-sp-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: var(--bbsw-sp-gap);
  }


  #bbsw-sponsors .bbsw-sp-tile {
    -webkit-appearance: none;
    appearance: none;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    width: max(
      calc((100% - (var(--bbsw-sp-cols, 5) - 1) * var(--bbsw-sp-gap)) / var(--bbsw-sp-cols, 5)),
      min(var(--bbsw-sp-min, 160px), calc((100% - var(--bbsw-sp-gap)) / 2))
    );
    min-height: 64px;
    margin: 0;
    padding: 12px;
    background: #fff;
    border: 1px solid var(--bbsw-sp-border);
    border-radius: 8px;
    box-shadow: none;
    color: inherit;
    font: inherit;
    letter-spacing: normal;
    text-transform: none;
    line-height: 1.3;
    cursor: pointer;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  #bbsw-sponsors .bbsw-sp-tile:hover { border-color: var(--bbsw-sp-red); }

  #bbsw-sponsors .bbsw-sp-tile[aria-expanded="true"] {
    border-color: var(--bbsw-sp-red);
    box-shadow: 0 0 0 1px var(--bbsw-sp-red);
  }

  #bbsw-sponsors .bbsw-sp-tile:focus-visible,
  #bbsw-sponsors .bbsw-sp-close:focus-visible,
  #bbsw-sponsors .bbsw-sp-website:focus-visible {
    outline: 3px solid rgba(192, 57, 43, 0.35);
    outline-offset: 2px;
  }

  #bbsw-sponsors .bbsw-sp-tile-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: var(--bbsw-sp-logo-h, 70px);
  }

  #bbsw-sponsors .bbsw-sp-tile-logo img,
  #bbsw-sponsors .bbsw-sp-panel-logo img {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 100%;
    margin: 0;
    object-fit: contain;
  }

  #bbsw-sponsors .bbsw-sp-tile-name {
    font-size: 0.9em;
    font-weight: 700;
    color: #444;
  }

  /* Narrow containers (phones): fixed columns per tier keep the hierarchy visible.
     Based on the block's own width, not the screen, since Squarespace columns can be narrower. */
  #bbsw-sponsors { container-type: inline-size; }

  @container (max-width: 559px) {
    #bbsw-sponsors .bbsw-sp-tier-diamond  { --bbsw-sp-cols: 1; --bbsw-sp-logo-h: 96px; }
    #bbsw-sponsors .bbsw-sp-tier-platinum { --bbsw-sp-cols: 2; --bbsw-sp-logo-h: 76px; }
    #bbsw-sponsors .bbsw-sp-tier-gold     { --bbsw-sp-cols: 2; --bbsw-sp-logo-h: 62px; }
    #bbsw-sponsors .bbsw-sp-tier-silver   { --bbsw-sp-cols: 3; --bbsw-sp-logo-h: 48px; --bbsw-sp-gap: 10px; }

    #bbsw-sponsors .bbsw-sp-tile {
      width: calc((100% - (var(--bbsw-sp-cols) - 1) * var(--bbsw-sp-gap)) / var(--bbsw-sp-cols));
    }

    #bbsw-sponsors .bbsw-sp-tier-diamond .bbsw-sp-tile-logo { max-width: 280px; }
    #bbsw-sponsors .bbsw-sp-tier-silver .bbsw-sp-tile { padding: 8px 6px; }
  }

  /* Narrowest phones: 2 Silver columns so its logos stay readable. */
  @media (max-width: 399px) {
    #bbsw-sponsors .bbsw-sp-tier-silver { --bbsw-sp-cols: 2; --bbsw-sp-gap: 16px; }
  }

  /* Detail panel: inserted as a full-width row below the selected tile's row. */
  #bbsw-sponsors .bbsw-sp-panel {
    flex: 0 0 100%;
    position: relative;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: 20px 28px;
    padding: 20px;
    background: #fafafa;
    border: 1px solid var(--bbsw-sp-border);
    border-top: 3px solid var(--bbsw-sp-red);
    border-radius: 8px;
    animation: bbsw-sp-in 0.18s ease-out;
  }

  #bbsw-sponsors .bbsw-sp-panel[hidden] { display: none; }
  #bbsw-sponsors .bbsw-sp-panel:focus { outline: none; }

  @keyframes bbsw-sp-in {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    #bbsw-sponsors .bbsw-sp-panel { animation: none; }
    #bbsw-sponsors .bbsw-sp-tile { transition: none; }
  }

  #bbsw-sponsors .bbsw-sp-panel-logo {
    flex: 0 1 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 220px;
    max-width: 100%;
    height: 110px;
    padding: 12px;
    background: #fff;
    border: 1px solid var(--bbsw-sp-border);
    border-radius: 8px;
  }

  #bbsw-sponsors .bbsw-sp-panel-body {
    flex: 1 1 300px;
    min-width: 0;
  }

  #bbsw-sponsors .bbsw-sp-name {
    font-family: inherit;
    font-size: 1em;
    font-weight: 700;
    letter-spacing: normal;
    text-transform: none;
    line-height: 1.3;
    color: #222;
    margin: 0 0 2px;
    padding-right: 36px;
  }

  #bbsw-sponsors .bbsw-sp-tier-label {
    font-size: 0.75em;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--bbsw-sp-red);
    margin: 0 0 12px;
  }

  #bbsw-sponsors .bbsw-sp-desc p,
  #bbsw-sponsors .bbsw-sp-desc ul {
    font-size: 0.95em;
    line-height: 1.6;
    color: #333;
    margin: 0 0 0.8em;
  }

  #bbsw-sponsors .bbsw-sp-desc ul { padding-left: 1.25em; }
  #bbsw-sponsors .bbsw-sp-desc li { margin: 0.15em 0; }

  #bbsw-sponsors .bbsw-sp-website {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
    padding: 10px 18px;
    border-radius: 999px;
    background: var(--bbsw-sp-red);
    color: #fff;
    font-weight: 600;
    font-size: 0.9em;
    text-decoration: none;
    transition: background 0.15s ease;
  }

  #bbsw-sponsors .bbsw-sp-website:hover {
    background: var(--bbsw-sp-red-dark);
    color: #fff;
    text-decoration: none;
  }

  #bbsw-sponsors .bbsw-sp-close {
    -webkit-appearance: none;
    appearance: none;
    position: absolute;
    top: 8px;
    right: 8px;
    width: 36px;
    height: 36px;
    margin: 0;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: none;
    box-shadow: none;
    color: #888;
    font: inherit;
    font-size: 24px;
    line-height: 36px;
    cursor: pointer;
  }

  #bbsw-sponsors .bbsw-sp-close:hover { background: #eee; color: #222; }

  #bbsw-sponsors .bbsw-sp-status {
    color: #888;
    font-style: italic;
  }

  #bbsw-sponsors .bbsw-sp-test-banner {
    margin: 16px 0 0;
    padding: 8px 12px;
    border: 1px solid #e0c36b;
    border-radius: 6px;
    background: #fff6d6;
    color: #6b5300;
    font-size: 0.85em;
  }

  #bbsw-sponsors .bbsw-sp-visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
</style>

<div id="bbsw-sponsors">
  <p class="bbsw-sp-status">Loading sponsors&hellip;</p>
</div>

<script>
(function () {
  // The only data sources this block ever uses when published.
  var PRODUCTION_SOURCE = {
    dataUrl: 'https://raw.githubusercontent.com/YannanTang/bbsw-app/main/src/data/sponsors.json',
    logoBase: 'https://app.bbsw.org'
  };
  var TIERS = ['Diamond', 'Platinum', 'Gold', 'Silver'];
  var TEST_SOURCE_KEY = 'bbsw-sponsors-test-source';

  var root = document.getElementById('bbsw-sponsors');
  if (!root) return;

  // Test sources come only from outside this block: preview.html sets window.BBSW_SPONSORS_TEST_SOURCE,
  // or a tester sets localStorage['bbsw-sponsors-test-source'] in their own browser (see README.md).
  function testSource() {
    var s = window.BBSW_SPONSORS_TEST_SOURCE;
    if (!s) {
      try { s = JSON.parse(localStorage.getItem(TEST_SOURCE_KEY) || 'null'); } catch (e) { s = null; }
    }
    if (!s || typeof s.dataUrl !== 'string' || typeof s.logoBase !== 'string') return null;
    return { dataUrl: s.dataUrl, logoBase: s.logoBase, label: String(s.label || s.dataUrl) };
  }

  var test = testSource();
  var source = test || PRODUCTION_SOURCE;

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function str(v) { return typeof v === 'string' ? v.trim() : ''; }

  function logoUrl(logo) {
    if (!logo) return '';
    if (/^https?:\/\//i.test(logo)) return logo;
    return source.logoBase.replace(/\/+$/, '') + '/' + logo.replace(/^\/+/, '');
  }

  function websiteUrl(url) {
    return /^https?:\/\/\S+$/i.test(url) ? url : '';
  }

  // Keep only records the page can show: an id, a name and one of the four tiers.
  function normalize(data) {
    if (!Array.isArray(data)) return [];
    return data
      .filter(function (s) { return s && str(s.id) && str(s.name) && TIERS.indexOf(str(s.tier)) !== -1; })
      .map(function (s) {
        return {
          id: str(s.id),
          name: str(s.name),
          tier: str(s.tier),
          logo: logoUrl(str(s.logo)),
          website: websiteUrl(str(s.website)),
          description: typeof s.description === 'string' ? s.description : ''
        };
      });
  }

  // Plain-text description: blank lines separate paragraphs, lines starting with "• " are list items.
  function renderDescription(text) {
    var wrap = el('div', 'bbsw-sp-desc');
    text.split(/\n\s*\n/).forEach(function (chunk) {
      var current = null;
      chunk.split('\n').forEach(function (raw) {
        var line = raw.trim();
        if (!line) return;
        if (line.indexOf('• ') === 0) {
          if (!current || current.tagName !== 'UL') wrap.appendChild(current = el('ul'));
          current.appendChild(el('li', null, line.slice(2)));
        } else {
          if (!current || current.tagName !== 'P') {
            wrap.appendChild(current = el('p'));
          } else {
            current.appendChild(document.createElement('br'));
          }
          current.appendChild(document.createTextNode(line));
        }
      });
    });
    return wrap.childNodes.length ? wrap : null;
  }

  function nameFallback(name) { return el('span', 'bbsw-sp-tile-name', name); }

  function tile(sponsor) {
    var btn = el('button', 'bbsw-sp-tile');
    btn.type = 'button';
    btn.setAttribute('aria-expanded', 'false');
    btn.setAttribute('aria-controls', 'bbsw-sp-panel');
    btn.setAttribute('data-sponsor-id', sponsor.id);
    if (sponsor.logo) {
      var box = el('span', 'bbsw-sp-tile-logo');
      var img = el('img');
      img.src = sponsor.logo;
      img.alt = sponsor.name;
      img.loading = 'lazy';
      img.decoding = 'async';
      img.onerror = function () { btn.replaceChild(nameFallback(sponsor.name), box); };
      box.appendChild(img);
      btn.appendChild(box);
    } else {
      btn.appendChild(nameFallback(sponsor.name));
    }
    return btn;
  }

  var sponsorsById = {};
  var panel = el('div', 'bbsw-sp-panel');
  panel.id = 'bbsw-sp-panel';
  panel.hidden = true;
  panel.tabIndex = -1;
  panel.setAttribute('role', 'region');
  panel.setAttribute('aria-labelledby', 'bbsw-sp-panel-name');
  var current = null; // the selected tile button

  function fillPanel(sponsor) {
    panel.textContent = '';

    var close = el('button', 'bbsw-sp-close');
    close.type = 'button';
    close.setAttribute('aria-label', 'Close sponsor details');
    close.appendChild(el('span', null, '×')).setAttribute('aria-hidden', 'true');
    panel.appendChild(close);

    if (sponsor.logo) {
      var logoBox = el('div', 'bbsw-sp-panel-logo');
      var img = el('img');
      img.src = sponsor.logo;
      img.alt = ''; // the name heading next to it identifies the sponsor
      img.onerror = function () { panel.removeChild(logoBox); };
      logoBox.appendChild(img);
      panel.appendChild(logoBox);
    }

    var body = el('div', 'bbsw-sp-panel-body');
    var name = el('h3', 'bbsw-sp-name', sponsor.name);
    name.id = 'bbsw-sp-panel-name';
    body.appendChild(name);
    body.appendChild(el('p', 'bbsw-sp-tier-label', sponsor.tier + ' Sponsor'));

    var desc = renderDescription(sponsor.description);
    if (desc) body.appendChild(desc);

    if (sponsor.website) {
      var link = el('a', 'bbsw-sp-website');
      link.href = sponsor.website;
      link.target = '_blank';
      link.rel = 'noopener';
      link.setAttribute('aria-label', 'Visit the ' + sponsor.name + ' website (opens in a new tab)');
      link.appendChild(document.createTextNode('Visit website '));
      link.appendChild(el('span', null, '↗')).setAttribute('aria-hidden', 'true');
      body.appendChild(link);
    }
    panel.appendChild(body);
  }

  // Put the panel directly after the last tile in the selected tile's current row.
  // Rows are measured with the panel taken out of the flow (not hidden, so focus inside it is kept),
  // because a full-width panel in the wrong place would itself change where the tiles wrap.
  function placePanel() {
    if (!current) return;
    var grid = current.parentNode;
    panel.style.position = 'absolute';
    var top = current.offsetTop;
    var rowEnd = current;
    for (var next = current.nextElementSibling; next; next = next.nextElementSibling) {
      if (next === panel) continue;
      if (next.offsetTop !== top) break;
      rowEnd = next;
    }
    panel.style.position = '';
    if (panel.parentNode !== grid || panel.previousElementSibling !== rowEnd) {
      var focused = panel.contains(document.activeElement) ? document.activeElement : null;
      grid.insertBefore(panel, rowEnd.nextElementSibling);
      if (focused && document.activeElement !== focused) focused.focus({ preventScroll: true }); // moving a node drops focus
    }
  }

  function closePanel() {
    if (!current) return;
    current.setAttribute('aria-expanded', 'false');
    current = null;
    panel.hidden = true;
  }

  function openPanel(btn) {
    if (current === btn) { closePanel(); return; }
    if (current) current.setAttribute('aria-expanded', 'false');
    current = btn;
    fillPanel(sponsorsById[btn.getAttribute('data-sponsor-id')]);
    placePanel();
    panel.hidden = false;
    btn.setAttribute('aria-expanded', 'true');
    panel.focus({ preventScroll: true });
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    panel.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' });
  }

  function reset() {
    root.textContent = '';
    if (test) {
      root.appendChild(el('p', 'bbsw-sp-test-banner', 'TEST DATA SOURCE: ' + test.label + ' — not the production sponsor data.'));
    }
  }

  function render(sponsors) {
    reset();
    if (!sponsors.length) {
      root.appendChild(el('p', 'bbsw-sp-status', 'Sponsor information is coming soon.'));
      return;
    }
    TIERS.forEach(function (tier) {
      var list = sponsors
        .filter(function (s) { return s.tier === tier; })
        .sort(function (a, b) { return a.name.localeCompare(b.name, 'en', { sensitivity: 'base' }); });
      if (!list.length) return;
      var section = el('div', 'bbsw-sp-tier bbsw-sp-tier-' + tier.toLowerCase());
      section.appendChild(el('h2', 'bbsw-sp-heading', tier));
      var grid = el('div', 'bbsw-sp-grid');
      list.forEach(function (s) {
        sponsorsById[s.id] = s;
        grid.appendChild(tile(s));
      });
      section.appendChild(grid);
      root.appendChild(section);
    });

    root.addEventListener('click', function (e) {
      var btn = e.target.closest('.bbsw-sp-tile');
      if (btn && root.contains(btn)) { openPanel(btn); return; }
      if (e.target.closest('.bbsw-sp-close')) {
        var tileBtn = current;
        closePanel();
        if (tileBtn) tileBtn.focus();
      }
    });

    root.addEventListener('keydown', function (e) {
      if ((e.key === 'Escape' || e.key === 'Esc') && current) {
        var tileBtn = current;
        closePanel();
        tileBtn.focus();
      }
    });

    // Re-place the open panel whenever the block's width (and so the column count) changes.
    if (window.ResizeObserver) {
      new ResizeObserver(placePanel).observe(root);
    } else {
      window.addEventListener('resize', placePanel);
    }
  }

  fetch(source.dataUrl)
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (data) { render(normalize(data)); })
    .catch(function () {
      reset();
      var msg = el('p', 'bbsw-sp-status', 'Could not load sponsor information. Please try refreshing.');
      msg.style.color = '#c0392b';
      msg.style.fontStyle = 'normal';
      root.appendChild(msg);
    });
}());
</script>
