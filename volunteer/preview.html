<!doctype html>
<!-- Local preview of the Volunteer code block. From the repo root run:
       python3 -m http.server 8026
     then open http://localhost:8026/volunteer/preview.html
     page.json comes from this checkout, so unpushed edits show up. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volunteer page preview</title>
  <style>
    body { margin: 0; background: #fff; font-family: "Helvetica Neue", Arial, sans-serif; }
    .sq-page { max-width: 1020px; margin: 0 auto; padding: 48px 24px 80px; }
    .sq-native { text-align: center; margin-bottom: 28px; color: #202020; }
    .sq-native h1 { font-family: Georgia, serif; font-size: 44px; margin: 0; }
    .sq-tag { display: inline-block; font: 600 11px/1 "Helvetica Neue", Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase;
      color: #888; border: 1px dashed #bbb; border-radius: 4px; padding: 4px 8px; margin-bottom: 12px; }
  </style>
  <script>window.BBSWVOL_SOURCES = { site: '/' };</script>
</head>
<body>
  <div class="sq-page">
    <div class="sq-native">
      <span class="sq-tag">Squarespace text block (typed in the editor)</span>
      <h1>Volunteer with BBSW</h1>
    </div>
    <div class="sq-tag" style="display:table;margin:0 auto 20px">Squarespace code block (this repo)</div>
    <div id="block"></div>
  </div>
  <script>
    fetch('squarespace-code-block.html').then(function (r) { return r.text(); }).then(function (html) {
      var host = document.getElementById('block');
      host.innerHTML = html;
      host.querySelectorAll('script').forEach(function (old) {
        var s = document.createElement('script');
        s.textContent = old.textContent;
        old.replaceWith(s);
      });
    });
  </script>
</body>
</html>
